name: Test Windows deployment

on:
  push:
    branches: [main]
    paths:
      - scripts/deploy/**
      - tests/deployment/**
      - .github/workflows/test-windows-deployment.yml
  pull_request:
    paths:
      - scripts/deploy/**
      - tests/deployment/**
      - .github/workflows/test-windows-deployment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test updates and failure recovery on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\deployment\Run-Tests.ps1
      - name: Test updates and failure recovery on PowerShell 7
        shell: pwsh
        run: .\tests\deployment\Run-Tests.ps1
