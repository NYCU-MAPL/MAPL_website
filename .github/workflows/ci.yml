name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run static QA
        id: static-qa
        continue-on-error: true
        run: npm run qa:static
      - name: Run browser QA
        id: browser-qa
        continue-on-error: true
        run: npm run qa:browser
      - name: Upload static QA reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-qa-${{ github.run_id }}
          path: artifacts/static/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser QA reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-qa-${{ github.run_id }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce QA result
        if: ${{ always() }}
        env:
          STATIC_QA_OUTCOME: ${{ steps.static-qa.outcome }}
          BROWSER_QA_OUTCOME: ${{ steps.browser-qa.outcome }}
        run: |
          test "$STATIC_QA_OUTCOME" = success
          test "$BROWSER_QA_OUTCOME" = success
