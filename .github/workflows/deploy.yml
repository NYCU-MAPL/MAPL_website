name: Deploy gh-pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out validated source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Re-run static QA
        run: npm run qa:static
      - name: Re-run browser QA
        run: npm run qa:browser
      - name: Verify publication marker
        run: test -f dist/.nojekyll
      - name: Upload validated publication tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gh-pages-${{ github.event.workflow_run.head_sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated publication tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gh-pages-${{ github.event.workflow_run.head_sha }}
          path: dist/
      - name: Reject unsafe publication entries
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -z "$(find dist -type l -print -quit)"
          test -z "$(find dist ! -type f ! -type d -print -quit)"
          ! find dist -type f -print | grep -Eq '(^|/)(\.git|\.github|node_modules|src|tests|artifacts|reports|test-results)(/|$)|(^|/)\.env(\.|$)|\.(pem|key)$'
      - name: Configure authenticated Git transport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Publish validated tree to gh-pages
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          trap 'rm -rf "$publish_dir"' EXIT
          git init --initial-branch=gh-pages "$publish_dir"
          git -C "$publish_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$publish_dir" ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C "$publish_dir" fetch --depth=1 origin gh-pages
            git -C "$publish_dir" checkout -B gh-pages FETCH_HEAD
          fi
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. "$publish_dir"/
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" config user.name "github-actions[bot]"
            git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_dir" commit -m "deploy: publish $VALIDATED_SHA"
          fi
          test "$(git -C "$publish_dir" ls-remote origin refs/heads/main | cut -f1)" = "$VALIDATED_SHA"
          if git -C "$publish_dir" rev-parse --verify '@{upstream}' >/dev/null 2>&1; then
            git -C "$publish_dir" diff --quiet '@{upstream}' HEAD || git -C "$publish_dir" push origin HEAD:gh-pages
          else
            git -C "$publish_dir" push origin HEAD:gh-pages
          fi
